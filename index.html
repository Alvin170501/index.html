<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Pernikahan Alvin & Ima</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #eef2f5;
            color: #1e2a3e;
            overflow-x: hidden;
        }

        /* ========== LOADER ========== */
        .loader {
            position: fixed;
            inset: 0;
            background: #fffef9;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11000;
            transition: 0.5s;
        }
        .loader.hide {
            opacity: 0;
            visibility: hidden;
        }
        .loader-ring {
            width: 65px;
            height: 65px;
            border: 3px solid #bdd4e7;
            border-top: 3px solid #2c7da0;
            border-radius: 50%;
            animation: spin 1s ease infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== COVER PAGE (PAKAI GAMBAR CANVA) ========== */
        .cover {
            position: fixed;
            inset: 0;
            z-index: 10500;
            transition: 0.7s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .cover.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .cover-img-wrapper {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .cover-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Overlay teks & tombol di atas gambar cover */
        .cover-overlay {
            position: absolute;
            bottom: 15%;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            padding: 0 20px;
        }

        .guest-name {
            background: rgba(224, 242, 254, 0.85);
            padding: 10px 28px;
            border-radius: 60px;
            color: #2c7da0;
            font-weight: 600;
            margin-bottom: 20px;
            display: inline-block;
            backdrop-filter: blur(4px);
            font-size: 1rem;
        }

        .btn-open {
            background: #2c7da0;
            border: none;
            padding: 14px 44px;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(44,125,160,0.3);
            transition: 0.2s;
            display: block;
            margin: 0 auto;
        }
        .btn-open:hover { transform: scale(1.02); background: #1f5a74; }

        /* ========== MAIN CONTENT (ISI UNDANGAN) ========== */
        .main-content {
            position: relative;
            z-index: 20;
            max-width: 580px;
            margin: 0 auto;
            opacity: 0;
            transition: 0.7s;
        }
        .main-content.show {
            opacity: 1;
        }

        .main-content img {
            width: 100%;
            display: block;
            border-radius: 0;
        }

        /* ========== MUSIC PLAYER ========== */
        .music-player {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 54px;
            height: 54px;
            background: #2c7da0;
            border-radius: 50%;
            display: none; /* Awalnya hidden, muncul setelah buka */
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 3000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: none;
        }

        /* ========== MODAL (Opsional, buat keluarga) ========== */
        .modal-custom {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 12000;
            align-items: center;
            justify-content: center;
        }
        .modal-custom.active { display: flex; }
        .modal-inner {
            background: white;
            width: 90%;
            max-width: 380px;
            border-radius: 44px;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 26px;
            cursor: pointer;
        }

        /* Responsive tweak */
        @media (max-width: 550px) {
            .guest-name {
                font-size: 0.9rem;
                padding: 8px 20px;
            }
            .btn-open {
                padding: 12px 30px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<!-- ========== LOADER ========== -->
<div class="loader" id="loader">
    <div class="loader-ring"></div>
</div>

<!-- ========== COVER PAGE ========== -->
<div class="cover" id="coverPage">
    <div class="cover-img-wrapper">
        <!-- Gambar Cover dari Canva -->
        <img src="cover.png" alt="Cover Undangan">
        
        <!-- Tombol & Teks Tamu di atas gambar -->
        <div class="cover-overlay">
            <div class="guest-name" id="guestNameDisplay">Yth. Alumni TKJ 4</div>
            <button class="btn-open" id="openWeddingBtn">
                <i class="fas fa-envelope-open-text"></i> Buka Undangan
            </button>
        </div>
    </div>
</div>

<!-- ========== AUDIO ========== -->
<audio id="bgm" loop>
    <source src="musik2.mp3" type="audio/mpeg">
</audio>

<!-- ========== MUSIC BUTTON ========== -->
<button class="music-player" id="musicBtn"><i class="fas fa-music"></i></button>

<!-- ========== MODALS (Opsional) ========== -->
<div id="modalAlvin" class="modal-custom">
    <div class="modal-inner">
        <span class="close-modal" onclick="closeModal('modalAlvin')">✕</span>
        <h3 style="color:#2c7da0;">M. Alvian</h3>
        <p>Cianjur, 17 Mei 2001</p>
        <img src="ortualvin1.jpg" style="width:100%; border-radius:28px; margin:15px 0;" onerror="this.src='https://placehold.co/400x300/bdd4e7/2c7da0?text=Keluarga+Alvin'">
        <p>Putra dari Bpk. Zen Abdul Aziz & Ibu Suryani Andriani</p>
    </div>
</div>
<div id="modalIma" class="modal-custom">
    <div class="modal-inner">
        <span class="close-modal" onclick="closeModal('modalIma')">✕</span>
        <h3 style="color:#2c7da0;">Siti Rohimah</h3>
        <p>Cianjur, 23 April 2006</p>
        <img src="ortuima1.jpg" style="width:100%; border-radius:28px; margin:15px 0;" onerror="this.src='https://placehold.co/400x300/bdd4e7/2c7da0?text=Keluarga+Ima'">
        <p>Putri dari Bpk. Ayo & Ibu Nani</p>
    </div>
</div>

<!-- ========== MAIN CONTENT (ISI UNDANGAN) ========== -->
<div class="main-content" id="mainContainer">
    <!-- Gambar Isi Undangan dari Canva (gambar panjang) -->
    <img src="isi-undangan.png" alt="Isi Undangan">
    
    <!-- BUKU TAMU (Tetap ada di bawah gambar) -->
    <div style="padding: 20px; background: white; margin-top: -5px;">
        <h3 style="text-align:center; color:#2c7da0; font-family:'Playfair Display', serif; font-size:1.5rem;">📖 Buku Tamu & Ucapan</h3>
        <form id="formUcapan" style="margin-top: 20px;">
            <input type="text" id="namaTamu" placeholder="Nama Lengkap" required style="width:100%; padding:12px 16px; margin:8px 0; border:1px solid #cbdbe2; border-radius:34px; font-family:'Poppins', sans-serif;">
            <textarea id="pesanTamu" rows="2" placeholder="Doa dan ucapan untuk Alvin & Ima..." required style="width:100%; padding:12px 16px; margin:8px 0; border:1px solid #cbdbe2; border-radius:34px; font-family:'Poppins', sans-serif;"></textarea>
            <select id="kehadiran" style="width:100%; padding:12px 16px; margin:8px 0; border:1px solid #cbdbe2; border-radius:34px; font-family:'Poppins', sans-serif;">
                <option value="Hadir">✅ InsyaAllah Hadir</option>
                <option value="Tidak Hadir">❌ Mohon maaf tidak hadir</option>
            </select>
            <button type="submit" class="btn-open" style="width:100%; margin-top:10px;"><i class="fas fa-paper-plane"></i> Kirim Ucapan</button>
        </form>
        <div class="guestbook-list" id="daftarUcapan" style="margin-top:25px; max-height:380px; overflow-y:auto;"></div>
    </div>
</div>

<!-- ========== FIREBASE + SCRIPTS ========== -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPbK3U6Yoe8qNINXCwrX5WOMyGgfHqwiU",
        authDomain: "wedding-alvin-ima.firebaseapp.com",
        projectId: "wedding-alvin-ima",
        storageBucket: "wedding-alvin-ima.firebasestorage.app",
        messagingSenderId: "1026738748582",
        appId: "1:1026738748582:web:eeb9029dbe1987cfdd4867"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ucapanCollection = collection(db, "ucapan");
    const qry = query(ucapanCollection, orderBy("timestamp", "desc"));
    onSnapshot(qry, (snapshot) => {
        const container = document.getElementById("daftarUcapan");
        if(container) {
            container.innerHTML = "";
            snapshot.forEach(doc => {
                const data = doc.data();
                const div = document.createElement("div");
                div.className = "guest-card";
                div.style = "background:#fafcff; border-radius:20px; padding:14px; margin-bottom:12px; border-left:5px solid #2c7da0;";
                div.innerHTML = `<strong style="color:#2c7da0;">${data.nama || 'Tamu'}</strong> <span style="float:right; background:${data.status === 'Hadir' ? '#2c7da0' : '#8aaec0'}; color:white; padding:2px 12px; border-radius:50px; font-size:0.7rem;">${data.status}</span><p style="margin-top:8px;">${data.pesan}</p>`;
                container.appendChild(div);
            });
        }
    });
    document.getElementById("formUcapan")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const nama = document.getElementById("namaTamu").value.trim();
        const pesan = document.getElementById("pesanTamu").value.trim();
        const status = document.getElementById("kehadiran").value;
        if(!nama || !pesan) { alert("Nama dan ucapan harus diisi 💙"); return; }
        await addDoc(ucapanCollection, { nama, pesan, status, timestamp: serverTimestamp() });
        document.getElementById("formUcapan").reset();
        alert("✨ Ucapan terkirim! Terima kasih atas doanya ✨");
    });
</script>

<script>
    // ========== NAMA TAMU DARI URL ==========
    const urlParam = new URLSearchParams(window.location.search);
    let guestFromUrl = urlParam.get('to') || "Alumni TKJ 4";
    document.getElementById("guestNameDisplay").innerHTML = `Yth. ${guestFromUrl}`;

    // ========== MUSIC PLAYER ==========
    const bgAudio = document.getElementById("bgm");
    const musicBtn = document.getElementById("musicBtn");
    musicBtn.onclick = () => {
        if(bgAudio.paused) { bgAudio.play().catch(()=>{}); musicBtn.innerHTML = "<i class='fas fa-music'></i>"; }
        else { bgAudio.pause(); musicBtn.innerHTML = "<i class='fas fa-pause'></i>"; }
    };

    // ========== BUKA UNDANGAN ==========
    document.getElementById("openWeddingBtn").onclick = () => {
        bgAudio.play().catch(()=>{});
        document.getElementById("coverPage").classList.add("hide");
        setTimeout(() => {
            document.getElementById("mainContainer").classList.add("show");
        }, 200);
        musicBtn.style.display = "flex";
    };

    // ========== MODAL ==========
    window.openModal = (id) => document.getElementById(id).classList.add("active");
    window.closeModal = (id) => document.getElementById(id).classList.remove("active");
    window.onclick = (e) => { if(e.target.classList?.contains('modal-custom')) e.target.classList.remove('active'); };

    // ========== LOADER ==========
    setTimeout(() => document.getElementById("loader")?.classList.add("hide"), 1100);
</script>

</body>
</html>
