<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Pernikahan Alvin & Ima</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #eef2f5;
            overflow-x: hidden;
        }

        /* ========== COVER PAGE ========== */
        .cover {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
            background: #fff;
        }
        .cover.hide {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .cover-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* ========== TEXT OVERLAY ========== */
        .text-overlay {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 500px;
            text-align: center;
            padding: 0 20px;
        }

        /* NAMA PENGANTIN */
        .names {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 10vw, 4.5rem);
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 0 4px 15px rgba(255,255,255,0.6);
            
            /* ANIMASI AWAL (HIDDEN) */
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        }
        .names.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* DIVIDER */
        .divider {
            width: 80px;
            height: 2px;
            background: #7f8c8d;
            margin: 10px auto 15px;
            opacity: 0;
            transform: scaleX(0);
            transition: all 0.6s ease 0.3s;
        }
        .divider.show {
            opacity: 1;
            transform: scaleX(1);
        }

        /* TEKS BAWAH (TANGGAL & LOKASI) */
        .bottom-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            color: #2c3e50;
            text-shadow: 0 2px 10px rgba(255,255,255,0.7);
            
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease 0.6s;
        }
        .bottom-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        .bottom-text .date {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 600;
            margin-bottom: 5px;
        }
        .bottom-text .location {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            color: #34495e;
        }

        /* TOMBOL BUKA UNDANGAN */
        .btn-buka {
            margin-top: 25px;
            background: #2c7da0;
            border: none;
            padding: 12px 35px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(44,125,160,0.3);
            transition: 0.3s;
            
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease 0.9s;
        }
        .btn-buka.show {
            opacity: 1;
            transform: translateY(0);
        }
        .btn-buka:hover {
            background: #1f5a74;
            transform: translateY(-2px);
        }

        /* ========== MAIN CONTENT (Halaman Isi) ========== */
        .main-content {
            max-width: 580px;
            margin: 0 auto;
            padding-top: 20px;
            opacity: 0;
            transition: opacity 0.7s ease;
        }
        .main-content.show {
            opacity: 1;
        }
        .main-content img {
            width: 100%;
            display: block;
        }

        /* MUSIC PLAYER */
        .music-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: #2c7da0;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: none;
        }
        .music-btn i { transition: 0.3s; }

        @media (max-width: 480px) {
            .names { margin-bottom: 0px; }
            .divider { margin: 5px auto 10px; }
            .bottom-text .location { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<!-- ========== COVER ========== -->
<div class="cover" id="coverPage">
    <!-- GAMBAR BACKGROUND (Ganti nama file sesuai gambar kamu) -->
    <img src="cover-bg.png" class="cover-img" alt="Cover Background">

    <div class="text-overlay">
        <!-- NAMA DI TENGAH -->
        <h1 class="names" id="namaAtas">Alvin & Ima</h1>
        <div class="divider" id="garisPemisah"></div>

        <!-- TEKS DI BAWAH -->
        <div class="bottom-text" id="teksBawah">
            <div class="date">Sabtu, 26 April 2027</div>
            <div class="location">Jatisari, Bojongpicung, Cianjur</div>
        </div>

        <!-- TOMBOL BUKA -->
        <button class="btn-buka" id="bukaUndangan">
            <i class="fas fa-envelope-open-text"></i> Buka Undangan
        </button>
    </div>
</div>

<!-- ========== MUSIC ========== -->
<audio id="bgm" loop>
    <source src="musik2.mp3" type="audio/mpeg">
</audio>
<button class="music-btn" id="musicBtn"><i class="fas fa-music"></i></button>

<!-- ========== ISI UNDANGAN (Halaman 2) ========== -->
<div class="main-content" id="mainContainer">
    <img src="isi-undangan.png" alt="Isi Undangan">
</div>

<!-- ========== FONT AWESOME ========== -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
    // ========== ANIMASI TEKS SAAT LOAD ==========
    window.addEventListener('DOMContentLoaded', () => {
        // Munculkan teks satu per satu dengan delay
        setTimeout(() => {
            document.getElementById('namaAtas').classList.add('show');
        }, 300);
        setTimeout(() => {
            document.getElementById('garisPemisah').classList.add('show');
        }, 600);
        setTimeout(() => {
            document.getElementById('teksBawah').classList.add('show');
        }, 900);
        setTimeout(() => {
            document.getElementById('bukaUndangan').classList.add('show');
        }, 1200);
    });

    // ========== NAMA TAMU OTOMATIS ==========
    const urlParam = new URLSearchParams(window.location.search);
    let guestFromUrl = urlParam.get('to') || "Alumni TKJ 4";
    
    // Tambahkan nama tamu di bawah tombol atau di mana saja
    // (Opsional, kalau mau langsung ditampilkan di cover)
    // const nameDisplay = document.createElement('div');
    // nameDisplay.innerText = `Yth. ${guestFromUrl}`;
    // nameDisplay.style.cssText = "margin-top:10px; font-size:0.9rem; color:#2c3e50; font-weight:400;";
    // document.querySelector('.text-overlay').appendChild(nameDisplay);

    // ========== BUKA UNDANGAN ==========
    const bgAudio = document.getElementById('bgm');
    const musicBtn = document.getElementById('musicBtn');
    
    document.getElementById('bukaUndangan').addEventListener('click', () => {
        // Putar musik
        bgAudio.play().catch(() => {});
        
        // Hilangkan cover
        document.getElementById('coverPage').classList.add('hide');
        
        // Munculkan isi undangan
        setTimeout(() => {
            document.getElementById('mainContainer').classList.add('show');
        }, 400);
        
        // Tampilkan tombol musik
        musicBtn.style.display = 'flex';
    });

    // ========== TOMBOL MUSIC ==========
    let isPlaying = false;
    musicBtn.addEventListener('click', () => {
        if (bgAudio.paused) {
            bgAudio.play().catch(() => {});
            musicBtn.innerHTML = '<i class="fas fa-music"></i>';
            isPlaying = true;
        } else {
            bgAudio.pause();
            musicBtn.innerHTML = '<i class="fas fa-pause"></i>';
            isPlaying = false;
        }
    });

    // ========== LOADER (Opsional) ==========
    // Hapus loader jika tidak diperlukan, atau tambahkan disini.
    // Karena cover langsung muncul, mungkin tidak perlu loader.
</script>

</body>
</html>
