<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Alvin & Ima</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Quicksand', sans-serif; background-color: #fffaf0; color: #333; overflow-x: hidden; }
        
        /* --- EFEK GERBANG ZOOM & TERBELAH --- */
        #tirai-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 2500;
            pointer-events: none;
            display: flex;
            visibility: hidden;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1); /* Efek Zoom Out */
            transform: scale(2); /* Posisi awal nge-zoom banget */
        }

        /* Saat tombol diklik, skala balik ke 1 (Zoom Out) */
        #tirai-container.zoom-out {
            transform: scale(1);
        }

        .panel-pohon {
            width: 50%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('VID-20250926-WA0059.jpg') center/cover;
            background-repeat: no-repeat;
            transition: transform 1.2s ease-in-out;
            transition-delay: 1.5s; /* Tunggu zoom out selesai baru kebuka */
        }
        .pohon-kiri { background-position: left center; border-right: 1px solid rgba(255,255,255,0.3); }
        .pohon-kanan { background-position: right center; border-left: 1px solid rgba(255,255,255,0.3); }

        /* Posisi kebuka */
        .opened .pohon-kiri { transform: translateX(-100%); }
        .opened .pohon-kanan { transform: translateX(100%); }

        /* --- STYLING ASLI --- */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 9999; }
        .spinner { width: 60px; height: 60px; border: 4px solid #f3f3f3; border-top: 4px solid #d4af37; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #cover { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100vh; 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            z-index: 3000; 
            transition: opacity 0.8s ease; 
            text-align: center; color: white; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('VID-20250926-WA0059.jpg') center/cover; 
        }
        
        .main-content { padding: 60px 0; opacity: 0; transition: opacity 1s; }
        .main-content.visible { opacity: 1; }
        
        .section-card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(15px);
            margin: 0 auto 40px; padding: 45px 25px; 
            border-radius: 35px; width: 90%; max-width: 450px; 
            text-align: center; border: 1px solid rgba(212,175,55,0.25); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
            opacity: 0; transform: translateY(40px); 
            transition: all 1.2s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .section-card.appear { opacity: 1; transform: translateY(0); }

        .btn-modern { display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, #d4af37, #b8860b); color: #fff; border-radius: 50px; font-weight: bold; text-decoration: none; border: none; cursor: pointer; margin-top: 20px; box-shadow: 0 5px 15px rgba(184, 134, 11, 0.4); }
        .music-btn { position: fixed; bottom: 25px; right: 25px; background: #d4af37; color: white; width: 50px; height: 50px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 7000; cursor: pointer; }
        
        #countdown { display: flex; justify-content: center; gap: 10px; margin-top: 25px; }
        .cd-item { background: white; border: 1px solid rgba(212,175,55,0.3); padding: 10px; border-radius: 15px; min-width: 65px; }
        .cd-number { display: block; font-size: 1.5em; font-weight: bold; color: #b8860b; }
        .cd-label { font-size: 0.65em; text-transform: uppercase; color: #888; }
    </style>
</head>
<body style="overflow: hidden;">

    <div id="tirai-container">
        <div class="panel-pohon pohon-kiri" id="pKiri"></div>
        <div class="panel-pohon pohon-kanan" id="pKanan"></div>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p style="font-family: 'Playfair Display'; color: #b8860b; margin-top: 20px; letter-spacing: 2px;">Menyulam Kebahagiaan...</p>
    </div>

    <audio id="lagu" loop><source src="musik1.mp3" type="audio/mpeg"></audio>
    <div id="musicToggle" class="music-btn" onclick="toggleMusic()"><i class="fas fa-music"></i></div>

    <div id="cover">
        <h2 style="font-family: 'Dancing Script'; font-size: 2.2em; color: #d4af37; margin-bottom: 10px;">The Wedding of</h2>
        <h1 style="font-family: 'Playfair Display'; font-size: 3.2em; letter-spacing: 2px;">Alvin & Ima</h1>
        <div style="margin: 35px 0; border-top: 1px solid rgba(255,255,255,0.3); border-bottom: 1px solid rgba(255,255,255,0.3); padding: 20px;">
            <p style="font-size: 0.8em; letter-spacing: 3px; text-transform: uppercase;">Kepada Yth.</p>
            <h3 id="nama-tamu" style="font-size: 1.8em; margin-top: 10px; color: #d4af37; font-family: 'Playfair Display';">Tamu Undangan</h3>
        </div>
        <button onclick="bukaUndangan()" class="btn-modern">📩 Buka Undangan</button>
    </div>

    <div id="isi" class="main-content">
        <div class="section-card">
            <h2 style="font-family: 'Playfair Display'; color: #b8860b;">Assalamu'alaikum</h2>
            <div id="countdown">
                <div class="cd-item"><span id="days" class="cd-number">00</span><span class="cd-label">Hari</span></div>
                <div class="cd-item"><span id="hours" class="cd-number">00</span><span class="cd-label">Jam</span></div>
                <div class="cd-item"><span id="mins" class="cd-number">00</span><span class="cd-label">Menit</span></div>
                <div class="cd-item"><span id="secs" class="cd-number">00</span><span class="cd-label">Detik</span></div>
            </div>
        </div>

        <div class="section-card">
            <h2 style="font-family: 'Playfair Display'; color: #b8860b;">Waktu & Lokasi</h2>
            <p style="font-size: 1.3em; font-weight: bold; margin-top: 20px;">Minggu, 26 April 2027</p>
            <p>Pukul 09.00 WIB - Selesai</p>
        </div>
        
        <footer style="text-align: center; padding: 50px 0; color: #bbb; font-size: 0.7em; letter-spacing: 4px;">MADE WITH LOVE BY ALVIAN © 2027</footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPbK3U6Yoe8qNINXCwrX5WOMyGgfHqwiU",
            authDomain: "wedding-alvin-ima.firebaseapp.com",
            projectId: "wedding-alvin-ima",
            storageBucket: "wedding-alvin-ima.firebasestorage.app",
            messagingSenderId: "1026738748582",
            appId: "1:1026738748582:web:eeb9029dbe1987cfdd4867"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        // ... (Guestbook logic lo tetep sama)
    </script>

    <script>
        function bukaUndangan() {
            const lagu = document.getElementById('lagu');
            const tirai = document.getElementById('tirai-container');
            const cover = document.getElementById('cover');
            
            lagu.play();
            
            // 1. Hilangkan cover depan
            cover.style.opacity = '0';
            setTimeout(() => { 
                cover.style.display = 'none'; 
                tirai.style.visibility = 'visible';
                
                // 2. Jalankan Animasi Zoom Out
                tirai.classList.add('zoom-out');
                
                // 3. Setelah zoom out, gerbang terbuka
                setTimeout(() => {
                    tirai.classList.add('opened');
                    // Izinkan scroll & tampilkan isi
                    document.body.style.overflow = "auto";
                    document.getElementById('isi').classList.add('visible');
                    document.getElementById('musicToggle').style.display = 'flex';
                }, 1500); 

            }, 800);
        }

        // Timer Target 2027
        const targetDate = new Date("April 26, 2027 09:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = targetDate - now;
            if(diff < 0) return;
            document.getElementById('days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById('hours').innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            document.getElementById('mins').innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            document.getElementById('secs').innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
        }, 1000);

        window.addEventListener('load', () => { setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 1000); });
        function toggleMusic() { const a = document.getElementById('lagu'); const btn = document.querySelector('.music-btn i'); if(a.paused) { a.play(); btn.className = 'fas fa-music'; } else { a.pause(); btn.className = 'fas fa-pause'; } }
        const obs = new IntersectionObserver((entries) => { entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('appear'); }); }, { threshold: 0.1 });
        document.querySelectorAll('.section-card').forEach(s => obs.observe(s));
    </script>
</body>
</html>
