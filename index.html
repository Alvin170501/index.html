<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Alvin & Ima</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Quicksand', sans-serif; background-color: #fdfcf5; color: #333; overflow-x: hidden; }

        /* --- COVER --- */
        #cover { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: transform 1.5s cubic-bezier(0.8, 0, 0.2, 1); text-align: center; color: white; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('VID-20250926-WA0059.jpg') center/cover; }
        #cover.opened { transform: translateY(-100%); }
        .nama-tamu-cover { font-size: 1.8em; font-weight: bold; color: #d4af37; margin: 15px 0; display: block; }

        /* --- CONTENT --- */
        .main-content { padding: 80px 0; opacity: 0; transition: opacity 1s; }
        .main-content.visible { opacity: 1; }
        .section-card { background: #fff; margin: 0 auto 50px; padding: 50px 25px; border-radius: 40px 5px; width: 90%; max-width: 500px; text-align: center; border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 15px 35px rgba(0,0,0,0.05); opacity: 0; transform: translateY(30px); transition: all 1s ease-out; }
        .section-card.appear { opacity: 1; transform: translateY(0); }

        /* --- SLIDERS --- */
        .profile-slider { width: 200px; height: 200px; margin: 0 auto 20px; border-radius: 50%; overflow: hidden; border: 4px solid #d4af37; position: relative; cursor: pointer; }
        .profile-slider img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s; }
        .profile-slider img.active { opacity: 1; }

        /* --- VIDEO SECTION --- */
        .video-container { width: 100%; height: 350px; border-radius: 20px; overflow: hidden; margin: 20px 0; border: 2px solid #d4af37; }
        .video-container video { width: 100%; height: 100%; object-fit: cover; }

        .btn-modern { display: inline-block; padding: 15px 35px; background: linear-gradient(135deg, #d4af37, #b8860b); color: #fff; border-radius: 50px; font-weight: bold; text-decoration: none; box-shadow: 0 5px 15px rgba(212,175,55,0.3); margin-top: 20px; border: none; cursor: pointer; }
        
        .music-btn { position: fixed; bottom: 30px; right: 30px; background: #d4af37; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1100; cursor: pointer; display: none; }
    </style>
</head>
<body>

    <audio id="lagu" loop><source src="musik1.mp3" type="audio/mpeg"></audio>
    <div id="musicToggle" class="music-btn" onclick="toggleMusic()">🎵</div>

    <div id="cover">
        <h2 style="font-family: 'Dancing Script'; font-size: 2em; color: #d4af37;">The Wedding of</h2>
        <h1 style="font-family: 'Playfair Display'; font-size: 3.5em;">Alvin & Ima</h1>
        <div style="margin-top: 30px;">
            Kpd. Bapak/Ibu/Saudara/i:
            <span id="nama-tamu" class="nama-tamu-cover">Nama Tamu</span>
        </div>
        <button onclick="bukaUndangan()" class="btn-modern">📩 Buka Undangan</button>
    </div>

    <div id="isi" class="main-content">
        <div class="section-card">
            <h2>Mempelai</h2>
            <div class="profile-slider" id="sliderAlvin">
                <a href="alvin-1.jpg" data-lightbox="alvin"><img src="alvin-1.jpg" class="active"></a>
                <a href="alvin-2.jpg" data-lightbox="alvin"><img src="alvin-2.jpg"></a>
                <a href="alvin-3.jpg" data-lightbox="alvin"><img src="alvin-3.jpg"></a>
            </div>
            <h3>M. Alvian (Alvin)</h3>
            
            <h1 style="font-family: 'Dancing Script'; margin: 20px 0; color: #d4af37;">&</h1>

            <div class="profile-slider" id="sliderIma">
                <a href="ima-1.jpg" data-lightbox="ima"><img src="ima-1.jpg" class="active"></a>
                <a href="ima-2.jpg" data-lightbox="ima"><img src="ima-2.jpg"></a>
                <a href="ima-3.jpg" data-lightbox="ima"><img src="ima-3.jpg"></a>
            </div>
            <h3>Siti Rohimah (Ima)</h3>
        </div>

        <div class="section-card">
            <h2>Our Journey</h2>
            <p><strong>Juli 2025</strong><br>Pertemuan pertama yang mengubah segalanya.</p>
        </div>

        <div class="section-card" style="padding: 10px;">
            <div class="video-container">
                <video id="vidMempelai" loop muted playsinline>
                    <source src="video3.mp4" type="video/mp4">
                </video>
            </div>
            <p style="font-family: 'Dancing Script'; font-size: 1.5em; color: #d4af37;">Forever Together</p>
        </div>

        <div class="section-card">
            <h2>Lokasi</h2>
            <p><strong>Minggu, 26 April 2027</strong><br>Kediaman Mempelai Wanita</p>
            <a href="http://google.com/maps" target="_blank" class="btn-modern">📍 Buka Maps</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
    <script>
        function startSlider(id) {
            let cur = 0;
            const imgs = document.querySelectorAll(`#${id} img`);
            setInterval(() => {
                imgs[cur].classList.remove('active');
                cur = (cur + 1) % imgs.length;
                imgs[cur].classList.add('active');
            }, 3000);
        }

        function bukaUndangan() {
            document.getElementById('lagu').play();
            document.getElementById('vidMempelai').play();
            document.getElementById('cover').classList.add('opened');
            startSlider('sliderAlvin');
            startSlider('sliderIma');
            setTimeout(() => {
                document.getElementById('isi').classList.add('visible');
                document.getElementById('musicToggle').style.display = 'flex';
                document.body.style.overflow = 'auto';
            }, 600);
        }

        function toggleMusic() { 
            const a = document.getElementById('lagu'); 
            a.paused ? a.play() : a.pause(); 
        }

        const obs = new IntersectionObserver((es) => {
            es.forEach(e => { if (e.isIntersecting) e.target.classList.add('appear'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.section-card').forEach(c => obs.observe(c));
    </script>
</body>
</html>
